<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transformers Registration</title>
  <style>
    body {
      background: url('https://wallpapercave.com/wp/wp6624210.jpg') center/cover no-repeat;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: white;
    }
    .box {
      background: rgba(0,0,0,0.7);
      padding: 25px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 0 15px #f7d200;
    }
    h1 { color: #f7d200; }
    input {
      width: 90%;
      padding: 8px;
      margin: 8px 0;
      border: none;
      border-radius: 5px;
      background: #222;
      color: #fff;
    }
    button {
      width: 95%;
      padding: 10px;
      background: #f7d200;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    a {
      color: #f7d200;
      text-decoration: none;
      font-size: 14px;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="box">
    <h1>Join the Autobots</h1>
    <form action="login.html" method="get">
      <input type="text" placeholder="Unique Login ID" required><br>
      <input type="email" placeholder="Email" required><br>
      <input type="password" placeholder="Password (must include @)" required><br>
      <button type="submit">Register</button>
    </form>
    <p><a href="index.html">Already have an account? Login</a></p>
  </div>

</body>
</html>
